name: Keep Veritas AI Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Veritas AI
        run: |
          curl -f -sS -I https://veritas-ai-lk96.onrender.com/api/health || true
